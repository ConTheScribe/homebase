<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Homebase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one full-height portrait stage (phone-shaped, centred on desktop). The painted world fills it;
   a pine-glass sheet rises from the bottom as the homebase, with rooms opening as panels above it.
   Single committed look: the world and its glass UI stay the same whatever the host theme. */
:root{
  --night:#0d1f24;      /* letterbox */
  --pine:#163a35;       /* button text on cream */
  --glass:rgba(13,32,29,.9);  /* sheet and panels */
  --card:rgba(255,250,238,.07);
  --line:rgba(251,242,226,.16);
  --moss:#a9d05e;       /* focus, done states */
  --cream:#fbf2e2;      /* primary text */
  --ember:#e0553f;      /* the one warm accent: log, fire */
  --gold:#f2c46b;       /* XP */
  --mist:#c9dcd5;       /* secondary text */
  --font-display:'IM Fell English SC','Cormorant Garamond',Georgia,serif;
  --font-ui:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--font-ui)}
#stage{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#1e3560;box-shadow:0 0 80px rgba(0,0,0,.6)}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#world:active{cursor:grabbing}
.layer-ui{position:absolute;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .7s ease, transform .7s ease}
.is-hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
[hidden]{display:none!important}
button{font-family:var(--font-ui)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#intro{top:7%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
#intro h1{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,13vw,64px);letter-spacing:.04em;margin:0;text-shadow:0 2px 3px rgba(20,40,60,.45),0 0 26px rgba(20,60,90,.5)}
#intro p{margin:0;font-size:15px;color:#fbfdfb;text-shadow:0 1px 3px rgba(10,30,50,.75),0 0 14px rgba(10,30,50,.5)}
#intro .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#e4f1f4;text-shadow:0 1px 3px rgba(10,30,50,.7)}
#enter{margin-top:18px;font-family:var(--font-display);font-size:22px;letter-spacing:.12em;color:var(--pine);background:var(--cream);border:1.5px solid #25312e;border-radius:999px;padding:12px 40px;cursor:pointer;box-shadow:0 6px 30px rgba(251,242,226,.35)}
#intro .hint{font-size:13px;opacity:.9}
#loading{top:46%;text-align:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#skip{bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#hudTop{top:max(12px,env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.glass{background:rgba(14,36,34,.62);border:1px solid rgba(251,242,226,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px}
.stageTag{padding:8px 12px;display:flex;flex-direction:column;gap:1px;cursor:pointer;color:var(--cream);text-align:left}
.stageTag small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
.stageTag b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.03em}
.btns{display:flex;gap:8px}
.btn{font:500 13px var(--font-ui);color:var(--cream);padding:8px 12px;border-radius:999px;cursor:pointer}

/* homebase sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1);height:auto;max-height:88%}
#sheet.off{transform:translateY(110%)}
#sheet.open{height:86%}
.grab{display:flex;justify-content:center;padding:8px 0 4px;background:none;border:0;cursor:pointer;width:100%}
.grab span{width:42px;height:5px;border-radius:3px;background:rgba(251,242,226,.35)}
.trav{display:flex;align-items:center;gap:12px;padding:2px 0 10px}
.lvBadge{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ee6a52,#a8301f);border:2px dashed rgba(255,233,200,.7);font:700 15px var(--font-ui);color:#fff6e6;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.trav .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trav b{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1}
.trav small{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums}
.streak{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--cream);cursor:pointer;padding:4px}
.streak b{font:700 18px var(--font-ui);font-variant-numeric:tabular-nums}
.streak small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.bar{height:6px;border-radius:4px;background:rgba(251,242,226,.13);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding-bottom:4px}
.mini button{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 2px;color:var(--cream);cursor:pointer;min-width:0}
.mini svg{width:21px;height:21px}
.mini button[aria-current="true"]{background:rgba(251,242,226,.16);border-color:rgba(251,242,226,.55)}
.mini span{font-size:11px;color:var(--mist);font-variant-numeric:tabular-nums}
.tabs{display:none;gap:6px;padding:8px 0}
#sheet.open .tabs{display:flex}
.tabs button{flex:1;padding:9px 0;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mist);font-size:14px;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--pine);border-color:var(--cream)}
.sheetBody{display:none;flex:1;min-height:0;overflow-y:auto;padding:6px 2px 90px;-webkit-overflow-scrolling:touch}
#sheet.open .sheetBody{display:block}
#sheet.open .mini{display:none}
#logFab{position:absolute;z-index:6;right:max(16px,env(safe-area-inset-right,0px));font:700 16px var(--font-ui);color:#fff6ea;background:var(--ember);border:2px dashed rgba(255,226,200,.75);border-radius:999px;padding:12px 22px;box-shadow:0 8px 20px rgba(80,20,10,.45);cursor:pointer;transition:opacity .4s,transform .4s}
#logFab.off{opacity:0;pointer-events:none;transform:translateY(20px)}

/* shared content blocks */
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.sec h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.02em}
.sec .sub{margin:-6px 0 0;color:var(--mist);font-size:14px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .grow span{overflow-wrap:anywhere}
.row small{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums}
.row .num{font-variant-numeric:tabular-nums;color:var(--mist);font-size:14px;white-space:nowrap}
.ico{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.ico svg{width:20px;height:20px}
.x{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mist);font-size:18px;line-height:1;cursor:pointer}
.check{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1.5px dashed rgba(251,242,226,.45);display:grid;place-items:center}
.check.on{background:var(--moss);border:1.5px solid var(--moss)}
.check.on::after{content:"";width:12px;height:7px;border-left:3px solid #1d3a1c;border-bottom:3px solid #1d3a1c;transform:rotate(-45deg) translate(1px,-1px)}
button.row{width:100%;text-align:left;color:var(--cream);font-size:15px;cursor:pointer}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mist);font-size:14px;line-height:1.5;text-align:center}
.cta{font:700 15px var(--font-ui);color:var(--pine);background:var(--cream);border:0;border-radius:999px;padding:11px 18px;cursor:pointer}
.ghost{font:500 14px var(--font-ui);color:var(--cream);background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--cream);text-align:left;cursor:pointer;min-width:0}
.card .top{display:flex;align-items:center;gap:8px}
.card b{font-family:var(--font-display);font-weight:400;font-size:19px}
.card small{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums}
.habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.habit{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--cream);cursor:pointer;text-align:left;min-width:0;font-size:15px}
.habit small{color:var(--gold);font-size:12px;font-variant-numeric:tabular-nums}
.habit span{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--cream);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--pine);border-color:var(--cream)}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;background:rgba(242,196,107,.14);border:1px solid rgba(242,196,107,.35)}
.win{background:rgba(169,208,94,.16);border-color:rgba(169,208,94,.45)}
.rtabs{display:flex;gap:6px;padding:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.rtabs button{flex:1 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mist);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.rtabs button[aria-selected="true"]{background:var(--cream);color:var(--pine);border-color:var(--cream)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:var(--mist);font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(251,242,226,.16);color:var(--cream)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.statrow div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.statrow b{font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.statrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.statrow.three b{font-size:16px;white-space:nowrap}
.statrow small{font-size:11.5px;color:var(--mist);line-height:1.25}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mist)}
input.in,select.in{font:500 16px var(--font-ui);color:var(--cream);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
select.in option{color:#111}
.bookRow{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px 8px}
.bookRow .bb{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.bookRow .bb small{color:var(--mist);font-size:12.5px}
.bookRow .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookRow .pg{display:flex;align-items:center;gap:5px;color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.bookRow .pg .in{width:62px;padding:8px 6px;text-align:center}
.bookRow .ok{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid #b3a6ea;background:#b3a6ea26;color:#d9d1ff;font-size:16px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:13px;color:var(--mist);line-height:1.45}

/* modal panel */
#modal{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#modal .scrim{position:absolute;inset:0;background:rgba(5,15,14,.45)}
#modal .panel{position:relative;max-height:90%;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mHead{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.mHead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mHead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;text-wrap:balance}
.mHead small{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums}
.mHead .back{font-size:22px}
.mBody{overflow-y:auto;min-height:0;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
#toast{top:max(10px,env(safe-area-inset-top,0px));text-align:center;z-index:20;pointer-events:none}
#toast span{display:inline-flex;gap:10px;align-items:center;padding:10px 16px;font-size:15px;max-width:34ch;line-height:1.35;pointer-events:none}
#toast button{pointer-events:auto}
#toast.is-hidden button{pointer-events:none}
#toast button{font:700 14px var(--font-ui);color:var(--gold);background:none;border:0;cursor:pointer;padding:0}
#saveNote{position:absolute;z-index:7;left:0;right:0;top:max(70px,calc(env(safe-area-inset-top,0px) + 62px));text-align:center;font-size:12px;color:var(--cream);pointer-events:none}
#saveNote span{background:rgba(120,60,20,.75);padding:5px 10px;border-radius:999px}
#roomArt{position:absolute;inset:0;z-index:2;overflow:hidden;container-type:size;opacity:0;pointer-events:none;background:#1e3560}
#roomArt.on{pointer-events:auto}
#hudTop{z-index:3}
#veil{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
#veil::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#fffaf1,#f3ead9 60%,#d9d3e6);opacity:0}
#veil.in,#veil.out{pointer-events:auto}
#veil.in::before{animation:mistIn .9s ease-in forwards}
#veil.out::before{opacity:1;animation:mistOut 1s ease-out forwards}
@keyframes mistIn{0%,35%{opacity:0}100%{opacity:1}}
@keyframes mistOut{0%{opacity:1}100%{opacity:0}}
.puff{position:absolute;left:115%;top:var(--y);width:var(--s);aspect-ratio:2;background-image:var(--img);background-size:100% 100%;filter:drop-shadow(0 8px 14px rgba(90,90,140,.25))}
#veil.in .puff{animation:puffIn .85s cubic-bezier(.45,0,.25,1) forwards;animation-delay:var(--d)}
#veil.out .puff{left:var(--m);animation:puffOut 1s cubic-bezier(.45,0,.25,1) forwards;animation-delay:var(--d)}
@keyframes puffIn{to{left:var(--m)}}
@keyframes puffOut{to{left:calc(var(--m) - 140%);opacity:.2}}
#arrive{position:absolute;z-index:4;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s ease}
#arrive.on{opacity:1}
#arrive small{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#arrive b{font-family:var(--font-display);font-weight:400;font-size:38px;color:#fffaf0;text-shadow:0 2px 4px rgba(20,30,40,.55),0 0 24px rgba(20,40,60,.45)}
.roomFrame{--ax:.5;--ay:0;position:absolute;top:calc(var(--ay)*-100cqh);left:calc(var(--ax)*100%);height:max(100cqh,calc(100cqw*2576/1438));aspect-ratio:1438/2576;transform:translateX(calc(var(--ax)*-100%))}
.roomFrame img{width:100%;height:100%;display:block}
.fx{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);animation:twinkle 2.6s ease-in-out infinite}
.fx.glow{background:radial-gradient(circle,rgba(255,214,130,.85),rgba(255,200,110,0) 70%)}
.fx.glint{width:2.6%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(220,245,255,0) 70%);animation-duration:1.9s}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.fx.lantern{width:3.4%;background:radial-gradient(circle,rgba(255,214,130,.95),rgba(255,200,110,0) 70%)}
.fx.lantern.dim{animation:none;opacity:.12}
.fx.big{width:22%;background:radial-gradient(circle,rgba(255,225,160,.45),rgba(255,210,140,0) 70%);animation-duration:4s}
.fx.page{width:2.4%;aspect-ratio:1.4;border-radius:1px;background:#fbf6e8;border:1px solid #6b6a5e;animation:flutter 9s linear infinite;opacity:0}
@keyframes flutter{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
#roomArt.on{opacity:1}
#roomArt.on .roomFrame{animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(calc(var(--ax)*-100%)) scale(1.02)}to{transform:translateX(calc(var(--ax)*-100%)) scale(1.07) translateY(-1%)}}
#modal.withArt .scrim{background:linear-gradient(to bottom,rgba(5,15,14,0) 30%,rgba(5,15,14,.35))}
#modal.withArt .panel{max-height:56%}
.kb{position:absolute;top:0;left:0;height:max(100cqh,100cqw);aspect-ratio:1;transform-origin:var(--ox,50%) var(--oy,50%);
  transform:translate(calc(var(--x0)*(100cqw - 100%)),calc(var(--y0,.4)*(100cqh - 100%))) scale(var(--s0));animation:kb 24s ease-in-out infinite alternate}
.kb img{width:100%;height:100%;display:block}
@keyframes kb{to{transform:translate(calc(var(--x1)*(100cqw - 100%)),calc(var(--y1,.4)*(100cqh - 100%))) scale(var(--s1))}}
#homeArt{position:absolute;inset:0;z-index:2;overflow:hidden;container-type:size;opacity:0;transition:opacity 1s ease;pointer-events:none;background:#1e3560}
#homeArt.on{opacity:1}
.hot{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:none;border:0;padding:0;cursor:pointer;pointer-events:none}
#homeArt.on .hot{pointer-events:auto}
.hot:focus-visible{outline:2px solid var(--moss)}
.ember{position:absolute;width:.45%;aspect-ratio:1;border-radius:50%;background:#ffc46a;box-shadow:0 0 4px #ff9a3a;opacity:0;animation:rise 2.6s linear infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px)}}
.smoke{position:absolute;width:2.6%;aspect-ratio:1;border-radius:50%;background:rgba(240,240,232,.5);opacity:0;animation:puffup 6s ease-out infinite}
@keyframes puffup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:.6}100%{opacity:0;transform:translate(calc(-50% + 24px),-110px) scale(2.6)}}
.ash{position:absolute;width:5.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(40,44,46,.85),rgba(40,44,46,.5) 55%,rgba(40,44,46,0) 72%);opacity:0;transition:opacity 1.2s}
#homeArt .fx.fire,#homeArt .ember{transition:opacity 1.2s,transform 1.2s}
#homeArt[data-fire^="blazing"] .fx.fire{transform:translate(-50%,-50%) scale(1.35)}
#homeArt[data-fire^="low"] .fx.fire{opacity:.55}
#homeArt[data-fire^="embers"] .fx.fire{opacity:.4;filter:hue-rotate(-15deg) saturate(1.4)}
#homeArt[data-fire^="embers"] .ember:nth-child(odd){display:none}
#homeArt[data-fire^="embers"] .ash{opacity:.55}
#homeArt[data-fire^="cold"] .fx.fire,#homeArt[data-fire^="cold"] .ember{display:none}
#homeArt[data-fire^="cold"] .ash{opacity:1}
#homeArt[data-fire$="gold"] .fx.fire{filter:sepia(.6) saturate(1.8) brightness(1.15)}
.flame{display:inline-block}
.flame.embers{animation:smoulder 2.4s ease-in-out infinite}
.flame.blazing{animation:flicker 1.2s ease-in-out infinite}
@keyframes smoulder{50%{opacity:.5}}
@keyframes flicker{50%{transform:scale(1.12)}}
.fx.fire{width:16%;background:radial-gradient(circle,rgba(255,190,90,.55),rgba(255,170,70,0) 70%);animation-duration:.9s}

/* room keepers */
#npcFab{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:9px;padding:4px 16px 4px 4px;border-radius:999px;background:rgba(13,32,29,.86);border:1px solid var(--line);color:var(--cream);font:600 15px var(--font-ui);cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:opacity .4s,transform .4s}
#npcFab.off{opacity:0;pointer-events:none;transform:translateY(20px)}
#npcFab .face{width:46px;height:46px;border-radius:50%;background-size:270%;background-repeat:no-repeat;border:2px solid rgba(255,233,200,.75);flex:0 0 auto}
#npcFab .dot{position:absolute;left:38px;top:4px;width:12px;height:12px;border-radius:50%;background:#ffd96b;border:2px solid #10261f;animation:dotPulse 2.4s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(1.25)}}
#talk{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
#talk .tScrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,18,16,.2),rgba(8,18,16,.6) 45%,rgba(8,18,16,.94));animation:fadeIn .5s ease}
.tPortrait{position:absolute;left:50%;top:max(40px,env(safe-area-inset-top,0px));width:min(94%,560px,62dvh);aspect-ratio:1;object-fit:cover;translate:-50% 0;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 58%,transparent 100%);
  animation:tIn .7s cubic-bezier(.2,.8,.2,1),breathe 7s ease-in-out .7s infinite alternate;transform-origin:50% 90%;transition:opacity .5s,filter .5s}
@keyframes tIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes breathe{to{transform:scale(1.018) translateY(-3px)}}
@keyframes fadeIn{from{opacity:0}}
.tBox{position:relative;width:min(100% - 24px,640px);margin-bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;max-height:52%;animation:tIn .5s cubic-bezier(.2,.8,.2,1) .1s both}
.tName{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tName b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1;color:#fff6e6}
.tName small{color:var(--mist);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.tBody{font-size:17px;line-height:1.55;overflow:auto;min-height:3.1em;color:var(--cream);cursor:pointer}
.tChoices{display:flex;flex-direction:column;gap:8px}
.tChoices button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;background:rgba(251,242,226,.06);border:1px solid var(--line);color:var(--cream);font:500 15px var(--font-ui);cursor:pointer}
.tChoices button:hover{background:rgba(251,242,226,.12)}
.tChoices button .k{margin-left:auto;color:var(--mist);font-size:13px}
.tChoices button.pri{background:var(--ember);border:2px dashed rgba(255,226,200,.7);color:#fff6ea;font-weight:700;justify-content:center}
.tChoices .new{color:#ffd96b}
#talk.reading .tPortrait{opacity:.18;filter:blur(2px)}
#talk.reading .tBox{max-height:calc(100% - 70px - env(safe-area-inset-top,0px))}
#talk.reading .tBody{cursor:auto;font-size:16.5px}
.lesson h3{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 4px;color:#fff6e6;text-wrap:balance}
.lesson .meta{color:var(--mist);font-size:13px;margin:0 0 14px}
.lesson p{margin:0 0 12px;max-width:62ch}
.lesson .ask{margin:16px 0 4px;padding:12px 14px;border-left:3px solid #ffd96b;background:rgba(255,217,107,.08);border-radius:0 10px 10px 0}
.lesson .ask small{display:block;color:#ffd96b;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.tPortrait,.tBox,#talk .tScrim{animation:none}#npcFab .dot{animation:none}}
@media (prefers-reduced-motion:reduce){.flame{animation:none!important}.kb{animation:none}.ember,.smoke{display:none}#veil{display:none}#roomArt.on .roomFrame{animation:none}.fx{animation:none;opacity:.7}.fx.page{display:none}.layer-ui,#sheet,#logFab{transition:none}#modal .panel{animation:none}}

<body>


<div id="stage">
  <canvas id="world" aria-label="Animated descent from a moonlit sky, past a windmill on a cliff, down to your homebase tree with a campfire"></canvas>

    <p class="hint">Sound plays when you enter</p>
  </div>
  <div id="skip" class="layer-ui is-hidden"><button id="skipBtn" class="btn glass" type="button">Skip to homebase</button></div>

  <div id="hudTop" class="layer-ui is-hidden">
    <button id="stageTag" class="glass stageTag" type="button"><small id="stageNum">Stage 1 of 5</small><b id="stageName">The Root Door</b></button>
    <div class="btns">
      <button id="soundBtn" class="btn glass" type="button">Sound off</button>
      <button id="replayBtn" class="btn glass" type="button">Replay</button>
    </div>
  </div>
  <div id="saveNote" hidden><span id="saveNoteText"></span></div>

  <button id="logFab" class="off" type="button">+ Log</button>
  <button id="npcFab" class="off" type="button"><span class="face"></span><span class="nm"></span><span class="dot" hidden></span></button>
  <section id="sheet" class="off" aria-label="Homebase">

    <div id="sheetHead"></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-tab="run" aria-selected="false">This week</button>

  </section>

  <div id="homeArt"></div>
  <div id="roomArt" aria-hidden="true"></div>
  <div id="arrive" aria-live="polite"><small id="arriveSub"></small><b id="arriveName"></b></div>
  <div id="talk" hidden role="dialog" aria-modal="true" aria-labelledby="talkName"><div class="tScrim" data-act="tbye"></div><img class="tPortrait" alt=""><div class="tBox"><div class="tName"><b id="talkName"></b><small id="talkTitle"></small></div><div class="tBody" id="talkBody" aria-live="polite"></div><div class="tChoices" id="talkChoices"></div></div></div>
  <div id="modal" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
  <div id="veil" aria-hidden="true"><div class="puff" style="--y:-10%;--s:150%;--m:-30%;--d:0s"></div><div class="puff" style="--y:4%;--s:140%;--m:0%;--d:0.06s"></div><div class="puff" style="--y:18%;--s:160%;--m:-35%;--d:0.1s"></div><div class="puff" style="--y:32%;--s:150%;--m:-5%;--d:0.03s"></div><div class="puff" style="--y:46%;--s:165%;--m:-40%;--d:0.08s"></div><div class="puff" style="--y:60%;--s:150%;--m:-10%;--d:0.12s"></div><div class="puff" style="--y:74%;--s:160%;--m:-35%;--d:0.05s"></div><div class="puff" style="--y:88%;--s:150%;--m:-5%;--d:0.1s"></div><div class="puff" style="--y:25%;--s:120%;--m:30%;--d:0.15s"></div><div class="puff" style="--y:66%;--s:125%;--m:25%;--d:0.07s"></div></div>
  <div id="toast" class="layer-ui is-hidden"><span class="glass" id="toastBox"><span id="toastText"></span><button id="toastUndo" type="button" hidden>Undo</button></span></div>
</div>

<script>
(()=>{
'use strict';
const stage=document.getElementById('stage');
const cv=document.getElementById('world');
const ctx=cv.getContext('2d');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;


/* ---------- the art: one tall stacked image, measured in its own pixels ---------- */
const ART={src:'assets/descent.jpg',w:1438,h:8104,
  joins:[2276,4202,5978],                 // middle of each blended join
  fire:[.543,7331],lantern:[.642,7128],windowGlow:[.781,7153],door:[.78,7190],
  fall:[.689,6123,7148],stone:[.854,4939],traveller:[.42,7238],
  grassTop:7460,sky:[0,1500]};

/* ---------- utilities ---------- */
function mrng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mrng(1);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
const INK='#3a4660';
let S=1;
function newCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*S));c.height=Math.max(1,Math.ceil(h*S));const g=c.getContext('2d');g.scale(S,S);return [c,g];}

/* foreground cloud sprites, drawn in the same ink-and-colour way as the art */
function lobed(g,lobes,pal,o){
  g.save();g.strokeStyle=pal.ink;g.lineWidth=2.4;g.globalAlpha=.85;lobes.forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.stroke();});g.restore();
  lobes.forEach(([x,y,r])=>{const side=clamp((x-o.lightX)/o.span,-1,1),k=Math.max(0,side),off=r*(.28+k*.3);
    g.fillStyle=pal.shadow;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
    g.save();g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.clip();
    g.fillStyle=pal.mid;g.beginPath();g.arc(x-off*.55,y-off*.7,r*(1-k*.25),0,Math.PI*2);g.fill();
    g.fillStyle=pal.lit;g.beginPath();g.arc(x-off*1.05,y-off*1.15,r*(.82-k*.38),0,Math.PI*2);g.fill();g.restore();
    g.save();g.strokeStyle=pal.ink;g.lineWidth=1.1;g.globalAlpha=.65;g.beginPath();g.arc(x,y,r,Math.PI*1.06,Math.PI*1.94);g.stroke();g.restore();});
}
function cloudSprite(wpx,hpx,seed){
  rnd=mrng(seed);const [c,g]=newCanvas(wpx,hpx);const pal={ink:INK,lit:'#fde9cf',mid:'#f4cdae',shadow:'#a9b0d4',deep:'#8a93c2'};
  const yb=hpx*.82,br=wpx*.09,lobes=[];
  for(let x=wpx*.1;x<wpx*.9;x+=br*1.05)lobes.push([x+(rnd()-.5)*br*.4,yb-br*.5-rnd()*br*.35,br*(.8+rnd()*.5)]);
  [[.4,.75],[.64,.5]].forEach(([tx,th])=>{let x=tx*wpx,y=yb-br*1.2,rr=br*1.9,guard=0;const top=yb-th*hpx*.9;
    while(y-rr>top&&guard++<30){lobes.push([x+(rnd()-.5)*rr*.6,y,rr*(.9+rnd()*.3)]);lobes.push([x-rr*.9,y+rr*.25,rr*.65]);lobes.push([x+rr*.9,y+rr*.25,rr*.65]);y-=rr*.7;rr=Math.max(rr*.92,br*.8);x+=(rnd()-.5)*rr*.4;}});
  lobes.sort((a,b)=>a[1]-b[1]);lobed(g,lobes,pal,{lightX:wpx*.25,span:wpx*.6});
  g.save();g.globalCompositeOperation='destination-out';g.fillRect(0,yb,wpx,hpx);g.restore();
  g.save();g.globalCompositeOperation='source-atop';const gr=g.createLinearGradient(0,yb-hpx*.16,0,yb);gr.addColorStop(0,hexA(pal.deep,0));gr.addColorStop(1,hexA(pal.deep,.8));g.fillStyle=gr;g.fillRect(0,yb-hpx*.16,wpx,hpx*.16);
  g.strokeStyle=pal.ink;g.globalAlpha=.3;g.lineWidth=.8;for(let k=0;k<Math.round(wpx/7);k++){const y=yb-2-rnd()*hpx*.09,x=wpx*.06+rnd()*wpx*.84;g.beginPath();g.moveTo(x,y);g.lineTo(x+6+rnd()*24,y);g.stroke();}g.restore();
  return c;
}

/* ---------- state ---------- */
let W=0,H=0,DPR=1,K=1,T=0;           // K: css px per art px; T: total scroll distance in css px
const img=new Image();let imgReady=false;
const ANCHOR_Y=5528;
const STAGE_ART={2:{src:'assets/stage2.webp',x:711,y:445,w:727,h:1753,glows:[[.862,534],[.911,749],[.837,976]],string:[1400,1520]},
  3:{src:'assets/stage3.webp',x:645,y:446,w:793,h:1752,glows:[[.862,534],[.911,749],[.837,976]],string:[1400,1520],chimney:[.687,1300]},
  4:{src:'assets/stage4.webp',x:0,y:236,w:1438,h:1961,glows:[[.862,534],[.911,749],[.837,976],[.604,449],[.604,590]],string:[1400,1520],chimney:[.687,1300]},
  5:{src:'assets/stage5.webp',x:0,y:235,w:1438,h:2179,glows:[[.862,534],[.911,749],[.837,976],[.604,449],[.604,590],[.056,704]],string:[1400,1520],chimney:[.687,1300]}};
let chimSmoke=[];
let stageShown=1;const stageImgs={};
function loadStage(n){const a=STAGE_ART[n];if(!a||stageImgs[n])return;const im=new Image();im.onload=()=>{stageImgs[n]=im;};im.src=a.src;}
function activeStageArt(){for(let n=stageShown;n>=2;n--)if(STAGE_ART[n])return n;return 0;}
let clouds=[],stars=[],flies=[],embers=[],smoke=[],sparks=[],birds=[];
let p=0,anim=null,landed=false,started=false,t=0,nextBird=4;
const toScreen=(ax,ay)=>[ax*W,ay*K-p*T];

function layout(){
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  K=W/ART.w;T=Math.max(0,ART.h*K-H);S=Math.min(DPR,1.5);
  // foreground clouds sweep past each join at a faster parallax rate, hiding the seams
  rnd=mrng(9);clouds=[];
  const sprites=[cloudSprite(W*1.1,W*.62,3),cloudSprite(W*.8,W*.5,7),cloudSprite(W*.6,W*.38,12)];
  ART.joins.forEach((jy,i)=>{const pj=clamp((jy*K-H/2)/T,0,1);
    for(let k=0;k<2;k++){const f=1.35+k*.25,spr=sprites[(i+k)%3],w=spr.width/S,h=spr.height/S;
      clouds.push({spr,w,h,f,x:(k?W*.35:-W*.25)+(rnd()-.5)*W*.2,y:pj*T*f+H*(.45+k*.25),v:(8+rnd()*8)*(k?-1:1),a:.95});}});
  stars=[];for(let i=0;i<70;i++){const x=rnd(),y=rnd()*ART.sky[1]*.55;if(x>.6&&y<900)continue;stars.push({x,y,ph:rnd()*6,r:.6+rnd()*1.1});}
  flies=[];for(let i=0;i<9;i++)flies.push({cx:.62+rnd()*.3,cy:7000+rnd()*260,r:12+rnd()*24,ph:rnd()*6,sp:.3+rnd()*.5});
}

/* ---------- render ---------- */
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(col,a));g.addColorStop(1,hexA(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function onScreen(y,m=80){return y>-m&&y<H+m;}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!imgReady){ctx.fillStyle='#1e3560';ctx.fillRect(0,0,W,H);return;}
  const sy=p*T/K,sh=Math.min(ART.h-sy,H/K);
  ctx.drawImage(img,0,sy,ART.w,sh,0,0,W,sh*K);
  {const n=activeStageArt();const a=STAGE_ART[n],si=stageImgs[n];if(a&&si){const y=(ANCHOR_Y+a.y)*K-p*T;if(y<H&&y+a.h*K>0)ctx.drawImage(si,a.x*K,y,a.w*K,a.h*K);}}

  // twinkling stars in the night sky at the top
  stars.forEach(s=>{const [x,y]=toScreen(s.x,s.y);if(!onScreen(y,4))return;const a=.25+.6*Math.max(0,Math.sin(t*1.7+s.ph));ctx.fillStyle=`rgba(255,250,230,${a})`;ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fill();});

  // the glowing standing stone
  {const [x,y]=toScreen(...ART.stone);if(onScreen(y)){const a=.35+.3*Math.sin(t*2.1);glow(x,y,.09*W,'#c8f2ff',a);}}

  // waterfall shimmer and splash
  {const [x,y0]=toScreen(ART.fall[0],ART.fall[1]);const y1=ART.fall[2]*K-p*T;
    if(y1>-20&&y0<H+20){ctx.save();ctx.lineCap='round';ctx.setLineDash([8,16]);ctx.lineDashOffset=-t*110;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(x-1,Math.max(y0,-10));ctx.lineTo(x-1,Math.min(y1,H+10));ctx.stroke();ctx.lineDashOffset=-t*140+9;ctx.strokeStyle='rgba(200,235,245,.8)';ctx.beginPath();ctx.moveTo(x+1.5,Math.max(y0,-10));ctx.lineTo(x+1.5,Math.min(y1,H+10));ctx.stroke();ctx.restore();
      if(onScreen(y1,30))for(let k=0;k<3;k++){const a=(t*1.4+k/3)%1;ctx.strokeStyle=`rgba(255,255,255,${.6*(1-a)})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y1,3+a*12,1+a*3,0,0,Math.PI*2);ctx.stroke();}}}

  // plateau life: cloud shadows and a wind wave over the grass
  {const gy=ART.grassTop*K-p*T;if(gy<H){ctx.save();ctx.beginPath();ctx.rect(0,gy,W,H-gy+10);ctx.clip();
    ctx.fillStyle='rgba(20,50,30,.13)';[[0,.05,.55],[.6,.16,.4]].forEach(([o0,yo,sz])=>{const x=((t*12+o0*W*1.8)%(W*1.8))-W*.4,y=gy+yo*W*1.4;ctx.beginPath();ctx.ellipse(x,y,sz*W,sz*W*.2,0,0,Math.PI*2);ctx.ellipse(x+sz*W*.5,y+6,sz*W*.6,sz*W*.14,0,0,Math.PI*2);ctx.fill();});
    const wave=((t*65)%(W*1.8))-W*.4;const wg=ctx.createLinearGradient(wave-W*.16,0,wave+W*.16,0);wg.addColorStop(0,'rgba(235,255,180,0)');wg.addColorStop(.5,'rgba(235,255,180,.12)');wg.addColorStop(1,'rgba(235,255,180,0)');ctx.fillStyle=wg;ctx.fillRect(wave-W*.2,gy,W*.4,H);
    ctx.restore();}}

  // home lights
  const fl=.85+Math.sin(t*7)*.07+Math.sin(t*13.3)*.05;
  {const [x,y]=toScreen(...ART.lantern);if(onScreen(y))glow(x,y,.07*W*fl,'#ffcf7a',.55);}
  {const [x,y]=toScreen(...ART.windowGlow);if(onScreen(y))glow(x,y,.06*W*fl,'#ffd27a',.6);}
  {const n=activeStageArt();const a=STAGE_ART[n];if(a&&stageImgs[n]){a.glows.forEach(([gx,gy],i)=>{const [x,y]=toScreen(gx,ANCHOR_Y+gy);if(onScreen(y))glow(x,y,.05*W*(fl+Math.sin(t*3+i)*.05),'#ffd27a',.5);});
    if(a.chimney){const [cx,cy]=toScreen(a.chimney[0],ANCHOR_Y+a.chimney[1]);if(onScreen(cy,200)&&Math.random()<dt*3)chimSmoke.push({x:cx,y:cy,r:2.5,life:1});
      chimSmoke.forEach(s=>{s.life-=dt*.28;s.y-=12*dt;s.x+=Math.sin(t*.8+s.y*.04)*.25+3*dt;s.r+=dt*3.5;ctx.fillStyle=`rgba(240,240,232,${.28*Math.max(0,s.life)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});chimSmoke=chimSmoke.filter(s=>s.life>0);}
    for(let k=0;k<6;k++){const x=(.68+k*.05)*W,y=(ANCHOR_Y+a.string[0]+k*20)*K-p*T;if(onScreen(y))glow(x,y,.025*W,'#ffe3a0',.35+.25*Math.sin(t*2.3+k*1.7));}}}
  // campfire: flicker, embers, smoke
  {const [x,y]=toScreen(...ART.fire);if(onScreen(y,120)){
    const f2=1+Math.sin(t*11)*.1+Math.sin(t*17.3)*.07;glow(x,y,.16*W*f2,'#ffb24f',.28);glow(x,y-.01*W,.045*W*f2,'#fff0b0',.45);
    if(Math.random()<dt*14)embers.push({x:x+(Math.random()-.5)*6,y:y-.02*W,vx:(Math.random()-.5)*14,vy:-30-Math.random()*30,life:1});
    if(Math.random()<dt*2.5)smoke.push({x,y:y-.05*W,r:3,life:1});
    if(started&&audio.on&&landed&&Math.random()<dt*5)audio.crackle();}
    embers.forEach(e=>{e.life-=dt*.9;e.x+=e.vx*dt+Math.sin(t*5+e.y)*.3;e.y+=e.vy*dt;ctx.fillStyle=`rgba(255,${180+Math.random()*60|0},90,${Math.max(0,e.life)})`;ctx.fillRect(e.x-1,e.y-1,2,2);});embers=embers.filter(e=>e.life>0);
    smoke.forEach(s=>{s.life-=dt*.35;s.y-=14*dt;s.x+=Math.sin(t+s.y*.05)*.3-4*dt;s.r+=dt*4;ctx.fillStyle=`rgba(235,235,228,${.2*Math.max(0,s.life)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});smoke=smoke.filter(s=>s.life>0);}
  // fireflies around the tree once you land
  {const fv=smooth(.88,1,p);if(fv>0)flies.forEach(f=>{const x=f.cx*W+Math.cos(t*f.sp+f.ph)*f.r,y=f.cy*K-p*T+Math.sin(t*f.sp*1.3+f.ph)*f.r*.6;const a=fv*(.4+.6*Math.max(0,Math.sin(t*2+f.ph*3)));
    ctx.fillStyle=`rgba(255,236,150,${a})`;ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle=`rgba(255,236,150,${a*.25})`;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();});}

  drawBirds(dt);

  if(false)clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+40)c.x=-c.w-40;if(c.x<-c.w-60)c.x=W+30;const y=c.y-p*T*c.f;if(y>H||y+c.h<0)return;ctx.globalAlpha=c.a;ctx.drawImage(c.spr,c.x,y,c.w,c.h);});ctx.globalAlpha=1;

  sparks.forEach(k=>{k.life-=dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.vy+=60*dt;ctx.fillStyle=`rgba(255,226,140,${Math.max(0,k.life)})`;ctx.fillRect(k.x-1.5,k.y-1.5,3,3);});sparks=sparks.filter(k=>k.life>0);
}
function drawBirds(dt){
  if(p>.05&&p<.95){nextBird-=dt;if(nextBird<=0&&!birds.length){nextBird=10+Math.random()*9;const y=H*(.15+Math.random()*.35),dir=Math.random()<.5?1:-1;
    for(let i=0;i<5;i++)birds.push({x:dir>0?-30-i*16:W+30+i*16,y:y+(i%2)*9+i*3,v:dir*(34+Math.random()*8),ph:Math.random()*6});if(started&&audio.on)audio.chirps(3);}}
  birds.forEach(b=>{b.x+=b.v*dt;const f=Math.sin(t*9+b.ph)*4,y=b.y+Math.sin(t*1.3+b.ph)*4;
    ctx.fillStyle='#fbfaf4';ctx.strokeStyle='#2c3550';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(b.x-7,y-f);ctx.quadraticCurveTo(b.x-3,y-3,b.x,y);ctx.quadraticCurveTo(b.x+3,y-3,b.x+7,y-f);ctx.quadraticCurveTo(b.x+2,y+1,b.x,y+1.5);ctx.quadraticCurveTo(b.x-2,y+1,b.x-7,y-f);ctx.fill();ctx.stroke();});
  birds=birds.filter(b=>b.x>-200&&b.x<W+200);
}

/* ---------- audio, synthesised ---------- */
const audio={on:false,ctx:null,
  init(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const a=this.ctx=new AC();
    this.master=a.createGain();this.master.gain.value=0;this.master.connect(a.destination);
    const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
    this.buf=buf;const src=a.createBufferSource();src.buffer=buf;src.loop=true;this.wf=a.createBiquadFilter();this.wf.type='bandpass';this.wf.frequency.value=420;this.wf.Q.value=.6;this.wg=a.createGain();this.wg.gain.value=.5;
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=.11;lg.gain.value=220;lfo.connect(lg);lg.connect(this.wf.frequency);lfo.start();
    const lfo2=a.createOscillator(),lg2=a.createGain();lfo2.frequency.value=.063;lg2.gain.value=.18;lfo2.connect(lg2);lg2.connect(this.wg.gain);lfo2.start();
    src.connect(this.wf);this.wf.connect(this.wg);this.wg.connect(this.master);
    const src2=a.createBufferSource();src2.buffer=buf;src2.loop=true;src2.playbackRate.value=1.7;const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=2200;this.rg=a.createGain();this.rg.gain.value=0;
    src2.connect(hp);hp.connect(this.rg);this.rg.connect(this.master);src.start();src2.start();
    const white=a.createBuffer(1,a.sampleRate*.08,a.sampleRate),wd=white.getChannelData(0);for(let i=0;i<wd.length;i++)wd[i]=(Math.random()*2-1)*Math.pow(1-i/wd.length,3);this.crk=white;},
  setOn(v){this.on=v;if(!this.ctx)return;if(this.ctx.state==='suspended')this.ctx.resume();this.master.gain.setTargetAtTime(v?.75:0,this.ctx.currentTime,.4);},
  mix(){if(!this.ctx)return;const now=this.ctx.currentTime;this.wg.gain.setTargetAtTime(lerp(.75,.18,smooth(.1,.9,p)),now,.5);this.wf.frequency.setTargetAtTime(lerp(520,300,p),now,.8);this.rg.gain.setTargetAtTime(.05*smooth(.6,1,p),now,.8);},
  chirp(delay){const a=this.ctx;if(!a||!this.on)return;const t0=a.currentTime+delay,f=2600+Math.random()*1600;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*(Math.random()<.5?1.45:.7),t0+.09);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.05*smooth(.2,1,p)+.01,t0+.015);g.gain.exponentialRampToValueAtTime(.0005,t0+.13);o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+.15);},
  chirps(n){for(let i=0;i<n;i++)this.chirp(i*(.12+Math.random()*.1));},
  crackle(){const a=this.ctx;if(!a||!this.on)return;const s=a.createBufferSource();s.buffer=this.crk;s.playbackRate.value=.6+Math.random()*1.2;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1500+Math.random()*2500;const g=a.createGain();g.gain.value=.08+Math.random()*.08;s.connect(f);f.connect(g);g.connect(this.master);s.start();},
  bell(base,vol){const a=this.ctx;if(!a||!this.on)return;const t0=a.currentTime;[1,1.5,2.01].forEach((m,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=base*m;
    g.gain.setValueAtTime(0,t0+i*.09);g.gain.linearRampToValueAtTime(vol/(i+1),t0+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.09+2.2);o.connect(g);g.connect(this.master);o.start(t0+i*.09);o.stop(t0+i*.09+2.3);});}
};

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const intro=$('intro'),hudTop=$('hudTop'),skip=$('skip');
function setHud(v){hudTop.classList.toggle('is-hidden',!v);window.HB&&window.HB.show(v);}
function descend(from){anim={from,to:1,start:performance.now(),dur:reduce?1500:9500};landed=false;setHud(false);skip.classList.remove('is-hidden');}
function onLand(quiet){landed=true;skip.classList.add('is-hidden');setHud(true);if(!quiet){audio.bell(523,.12);audio.chirps(2);}try{localStorage.setItem('hb:lastOpen',new Date().toDateString());}catch(e){}}
$('skipBtn').addEventListener('click',()=>{anim={from:p,to:1,start:performance.now(),dur:700};});
const HOME_SQ={1:'assets/home-1.jpg',2:'assets/home-2.jpg',3:'assets/home-3.jpg',4:'assets/home-4.jpg',5:'assets/home-5.jpg'};
function syncHomeArt(){const el=document.getElementById('homeArt');const src=HOME_SQ[stageShown];const on=!!(src&&landed&&p>.995&&!anim);
  if(src&&el.dataset.src!==src){el.dataset.src=src;
    const up=stageShown>=2;
    const glows=!up?'':[[.70,.2],[.735,.285],[.69,.375]].map(([x,y],i)=>`<span class="fx glow" style="left:${x*100}%;top:${y*100}%;width:6%;animation-delay:-${i*.8}s"></span>`).join('');
    const str=!up?'':[[.59,.6],[.63,.605],[.665,.6],[.7,.6],[.735,.615],[.77,.625]].map(([x,y],i)=>`<span class="fx glow" style="left:${x*100}%;top:${y*100}%;width:3%;animation-delay:-${i*.5}s"></span>`).join('');
    const emb=[...Array(7)].map((_,i)=>`<span class="ember" style="left:${52.5+(i%3-1)*.6}%;top:68.5%;--dx:${(i%2?1:-1)*(6+i*3)}px;animation-delay:-${i*.37}s"></span>`).join('');
    const smk=stageShown>=3?[...Array(4)].map((_,i)=>`<span class="smoke" style="left:60%;top:50%;animation-delay:-${i*1.5}s"></span>`).join(''):'';
    el.innerHTML=`<div class="kb" style="--x0:.3;--x1:.85;--s0:1;--s1:1.12;--ox:55%;--oy:55%"><img src="${src}" alt="">${glows}${str}<span class="fx fire" style="left:52.5%;top:70%"></span><span class="ash" style="left:52.5%;top:69.5%"></span><span class="fx glow" style="left:${up?55.5:57.7}%;top:${up?58:61.3}%;width:5%"></span><span class="fx glow" style="left:65.5%;top:58.5%;width:4%"></span>${emb}${smk}
      <button class="hot" type="button" data-act="bonfire" style="left:52.5%;top:70%" aria-label="The bonfire"></button><button class="hot" type="button" data-act="door" style="left:65.5%;top:63%" aria-label="Your homebase"></button></div>`;}
  const fs=window.HB_FIRE||{state:'steady'};const fk=fs.state+(fs.gold?' gold':'');if(el.dataset.fire!==fk){el.dataset.fire=fk;}
  el.classList.toggle('on',on);}
window.HB_ENGINE={
  whoosh(){const a=audio.ctx;if(!a||!audio.on||!audio.buf)return;const src=a.createBufferSource();src.buffer=audio.buf;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=.7;const g=a.createGain();const t0=a.currentTime;
    f.frequency.setValueAtTime(300,t0);f.frequency.linearRampToValueAtTime(900,t0+.9);f.frequency.linearRampToValueAtTime(350,t0+2);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.5,t0+.8);g.gain.linearRampToValueAtTime(0,t0+2.1);
    src.connect(f);f.connect(g);g.connect(audio.master);src.start(t0);src.stop(t0+2.2);},
  setStage(n){if(n!==stageShown){stageShown=n;loadStage(n);for(let k=2;k<=n;k++)loadStage(k);}},
  reward(){const [x,y]=toScreen(...ART.traveller);burstAt(x,y-.04*W,16);audio.chirp(0);},
  levelUp(){const [x,y]=toScreen(...ART.traveller);burstAt(x,y-.04*W,40);const [fx,fy]=toScreen(...ART.fire);for(let i=0;i<30;i++)embers.push({x:fx+(Math.random()-.5)*10,y:fy-.02*W,vx:(Math.random()-.5)*50,vy:-60-Math.random()*60,life:1});audio.bell(659,.12);}
};
function burstAt(x,y,n=18){for(let i=0;i<n;i++)sparks.push({x,y,vx:(Math.random()-.5)*120,vy:-40-Math.random()*90,life:.9+Math.random()*.4});}
$('enter').addEventListener('click',()=>{started=true;intro.classList.add('is-hidden');audio.init();audio.setOn(true);$('soundBtn').textContent='Sound on';descend(0);});
$('soundBtn').addEventListener('click',()=>{audio.init();audio.setOn(!audio.on);$('soundBtn').textContent=audio.on?'Sound on':'Sound off';});
$('replayBtn').addEventListener('click',()=>{p=0;descend(0);});
let drag=null,wheelT=0;
cv.addEventListener('pointerdown',e=>{drag={y:e.clientY,p,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||!started||!T)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>6)drag.moved=true;if(drag.moved){anim=null;p=clamp(drag.p-dy/T*1.4,0,1);}});
cv.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d)return;if(!d.moved)tap(e);else settle();});
cv.addEventListener('wheel',e=>{if(!started||!T)return;e.preventDefault();anim=null;p=clamp(p+e.deltaY/T,0,1);clearTimeout(wheelT);wheelT=setTimeout(settle,250);},{passive:false});
function settle(){if(p>.9){anim={from:p,to:1,start:performance.now(),dur:500};}else{landed=false;setHud(false);skip.classList.remove('is-hidden');$('skipBtn').textContent='Back to homebase';}}
function near(x,y,a,r){const [ax,ay]=toScreen(...a);return Math.hypot(x-ax,y-ay)<r;}
function tap(e){if(!started||document.getElementById('homeArt').classList.contains('on'))return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(near(x,y,ART.fire,.09*W)){const [fx,fy]=toScreen(...ART.fire);for(let i=0;i<24;i++)embers.push({x:fx+(Math.random()-.5)*10,y:fy-.02*W,vx:(Math.random()-.5)*40,vy:-50-Math.random()*50,life:1});audio.crackle();audio.crackle();if(landed)window.HB.open('bonfire');return;}
  if(near(x,y,ART.door,.08*W)){audio.bell(392,.1);if(landed)window.HB.open('door');return;}
  if(near(x,y,ART.traveller,.07*W)){const [tx,ty]=toScreen(...ART.traveller);burstAt(tx,ty-.04*W);audio.chirps(3);if(landed)window.HB.expand();return;}
  if(near(x,y,ART.stone,.08*W)){const [sx,sy]=toScreen(...ART.stone);burstAt(sx,sy,24);audio.bell(659,.09);window.HB.open('room','lore');}}

/* ---------- loop ---------- */
let last=performance.now(),mixT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(anim){const k=clamp((now-anim.start)/anim.dur,0,1);p=lerp(anim.from,anim.to,ease(k));if(k>=1){anim=null;if(p>=.999&&!landed)onLand();}}
  render(dt);syncHomeArt();mixT-=dt;if(mixT<=0){mixT=.25;audio.mix();if(started&&audio.on&&p>.6&&Math.random()<.1)audio.chirps(1+Math.floor(Math.random()*3));}
  requestAnimationFrame(frame);}
img.onload=()=>{imgReady=true;(window.HB_GATE||Promise.resolve()).then(afterGate);};
function afterGate(){$('loading').classList.add('is-hidden');$('enter').hidden=false;$('signin').hidden=true;document.querySelector('#intro .hint').textContent='Sound plays when you enter';
  let seen=false;try{seen=localStorage.getItem('hb:lastOpen')===new Date().toDateString();}catch(e){}
  if(seen){started=true;p=1;intro.classList.add('is-hidden');onLand(true);}else intro.classList.remove('is-hidden');}
img.onerror=()=>{$('loading').textContent='The artwork could not load. Try reloading the page.';};
img.src=ART.src;
layout();requestAnimationFrame(frame);
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,250);});
})();
</script>

/* Embers: a missed day lowers the fire instead of resetting it.
   Log twice the next day to rekindle it, or rest at the bonfire once a week. */
const MILESTONES=[[7,'First blaze'],[30,'A month of fire'],[66,'Ready to carve'],[100,'A hundred days'],[365,'A year by the fire']];
function fireState(all){
  const P=S.profile||{};const rests=new Set(P.rests||[]),rek=new Set(P.rekindles||[]);const logged=new Set(all.map(e=>e.d));
  const days=new Set([...logged,...rests,...rek]);const cov=d=>days.has(d);
  const now=new Date(),t=today(),y=dstr(addDays(now,-1)),y2=dstr(addDays(now,-2));
  const todayN=all.filter(e=>e.d===t).length;
  const pending=!cov(y)&&cov(y2)&&todayN<2;
  let d=pending?addDays(now,-2):cov(t)?now:addDays(now,-1);let n=0,perfect=true,startD=null;
  while(cov(dstr(d))){const k=dstr(d);n++;startD=k;if(!logged.has(k))perfect=false;d=addDays(d,-1);}
  let state;
  if(pending)state='embers';else if(!n)state='cold';else if(cov(t))state=n>=7?'blazing':'steady';else state='low';
  return{n,state,perfect:perfect&&n>=7,todayN,need:pending?2-todayN:0,startD,days,logged,rests,rek,loggedToday:logged.has(t),missed:y};
}
function streakInfo(all){return fireState(all);}
const FIRE={blazing:{c:'#ffb347',w:'Blazing'},steady:{c:'#ff9a4a',w:'Burning'},low:{c:'#d98a4a',w:'Burning low'},embers:{c:'#c0503a',w:'Embers'},cold:{c:'#8a8f88',w:'Cold'}};
function fireColor(f){return f.perfect&&f.state!=='embers'&&f.state!=='cold'?'#ffd96b':FIRE[f.state].c;}
function checkFire(){
  const f=fireState(entries());
  if(f.state==='embers'||!f.n)return;
  if(f.todayN>=2&&!f.logged.has(f.missed)&&!f.rests.has(f.missed)&&!f.rek.has(f.missed)&&f.days.has(dstr(addDays(new Date(),-2)))){
    saveProfile(p=>{p.rekindles=[...(p.rekindles||[]),f.missed];});const g=fireState(entries());
    toast(`The fire is rekindled. Your ${g.n}-day streak holds.`,null);window.HB_ENGINE?.levelUp();return;}
  const ms=MILESTONES.find(([m])=>m===f.n);const key=ms&&`${f.startD}:${ms[0]}`;

}

function log(h,extra={}){
  const d=extra.d||today();const w=weekOf(parseD(d));
  const e={id:uid(),h:h.id,p:h.p,xp:h.xp,t:Date.now(),d,...extra};

function makePuffs(){

    for(let x=90;x<560;x+=62)lobes.push([x+(r()-.5)*16,236-r()*18,50+r()*16]);
    for(let k=0;k<4;k++)lobes.push([200+k*80+(r()-.5)*30,160-r()*40,62+r()*22]);
    lobes.push([300+(r()-.5)*60,100,70]);
    lobes.sort((a,b)=>a[1]-b[1]);
    g.lineWidth=4;g.strokeStyle='#6a7290';lobes.forEach(([x,y,rr])=>{g.beginPath();g.arc(x,y,rr,0,7);g.stroke();});
    lobes.forEach(([x,y,rr])=>{const gr=g.createLinearGradient(0,y-rr,0,y+rr);gr.addColorStop(0,'#fffaf1');gr.addColorStop(.55,'#f6ecdf');gr.addColorStop(1,'#d6d6ea');g.fillStyle=gr;g.beginPath();g.arc(x,y,rr,0,7);g.fill();});
    g.globalCompositeOperation='destination-out';g.fillRect(0,262,640,60);g.globalCompositeOperation='source-over';
    g.strokeStyle='#6a7290';g.lineWidth=3.5;g.beginPath();g.moveTo(52,262);g.lineTo(590,262);g.stroke();
    g.globalAlpha=.35;g.lineWidth=1.6;for(let k=0;k<14;k++){const y=248-r()*16,x=80+r()*440;g.beginPath();g.moveTo(x,y);g.lineTo(x+20+r()*30,y);g.stroke();}g.globalAlpha=1;
    return c.toDataURL();};
  const urls=[mk(3),mk(11),mk(29)];
  document.querySelectorAll('#veil .puff').forEach((p,i)=>p.style.setProperty('--img',`url(${urls[i%3]})`));
}

/* ---- goals ---- */
function goalSaved(g,all){return (+g.start||0)+all.filter(e=>e.goal===g.id).reduce((a,e)=>a+(+e.amt||0),0);}
function monthsLeft(dl){if(!dl)return null;const a=new Date(),b=parseD(dl);return Math.max(0,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()>=a.getDate()?0:-1));}
function goalsTab(st){const goals=S.profile.goals||[];
  const rows=goals.map(g=>{const saved=goalSaved(g,st.all),frac=g.target?Math.min(1,saved/g.target):0,left=Math.max(0,g.target-saved);const ml=monthsLeft(g.date);
    const pace=g.date&&left>0?(ml>0?`${money(left/ml)} a month to reach it by ${parseD(g.date).toLocaleDateString('en-ZA',{month:'short',year:'numeric'})}`:'Target date reached'):'';
    return`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><div style="display:flex;gap:10px;align-items:center"><span class="grow"><span style="font-size:16px">${esc(g.name)}</span><small>${money(saved)} of ${money(g.target)}${frac>=1?' · reached':''}</small></span><span class="num">${Math.round(frac*100)}%</span><button class="x" type="button" data-act="delgoal" data-g="${g.id}" aria-label="Remove ${esc(g.name)}">×</button></div>
      ${bar(frac,frac>=1?'#a9d05e':'#e2b64c')}${pace?`<small style="color:var(--mist);font-size:13px">${pace}</small>`:''}
      <div class="actions"><button class="ghost" type="button" data-act="contrib" data-g="${g.id}" style="padding:8px 14px">Add money</button></div></div>`;}).join('');
  const total=goals.reduce((a,g)=>a+goalSaved(g,st.all),0),target=goals.reduce((a,g)=>a+(+g.target||0),0);
  return`<div class="sec"><h3>Saving goals</h3>${goals.length?`<p class="sub">${money(total)} saved of ${money(target)} across ${goals.length} goal${goals.length===1?'':'s'}. Each deposit earns +25 XP.</p>${rows}`:'<div class="empty">Add something you are saving toward, like travel or a house deposit.</div>'}</div>
  <div class="sec"><h3>New goal</h3><form id="goalForm" style="display:flex;flex-direction:column;gap:10px">
    <label class="f">Name<input class="in" id="gName" type="text" maxlength="40" placeholder="e.g. Japan trip"></label>
    <div class="formgrid"><label class="f">Target (R)<input class="in" id="gTarget" type="number" inputmode="numeric" min="1" placeholder="40000"></label>
    <label class="f">Saved so far (R)<input class="in" id="gStart" type="number" inputmode="numeric" min="0" placeholder="0"></label></div>
    <label class="f">Target date (optional)<input class="in" id="gDate" type="date"></label>
    <p class="note" id="gErr" hidden></p><button class="cta" type="submit">Add goal</button></form></div>`;}

  <div class="sec"><h3>New account</h3><form id="acctForm" style="display:flex;flex-direction:column;gap:10px">

  if(pid==='wealth'){const ex=wk.filter(e=>e.h==='expense');const spent=ex.reduce((a,e)=>a+(+e.amt||0),0);const cap=S.profile.cap||0;

  if(pid==='lore'){const all=st.all;
    return`<div class="sec"><h3>Bookshelf</h3><p class="sub">Change the page number and tap ✓. Every time it goes up, it counts as reading.</p>${S.profile.books.length?S.profile.books.map(b=>bookRow(b,all)).join(''):'<div class="empty">Add what you are reading to track pages toward the end.</div>'}

  if(pid==='discipline'){const td=today();const dailies=S.profile.habits.filter(h=>h.daily);const days=[...Array(7)].map((_,i)=>dstr(addDays(w.mon,i)));

  return{title:'Your homebase',sub:`Traveller level ${t.lv}`,body:`<div class="sec"><p class="sub" style="margin:0">Your home grows as your traveller levels up. Every path counts toward it.</p></div>
    <div class="sec">${STAGES.map((s,i)=>`<div class="row">${i<=si?'<span class="check on"></span>':'<span class="check"></span>'}<span class="grow"><span>${i+1}. ${s.n}</span><small>${i<=si?(i===si?'You are here':'Reached'):`Unlocks at traveller level ${s.lv}`}</small></span></div>`).join('')}</div>
    <div class="sec"><h3>Preview</h3><p class="sub">See a stage on your mountain before you reach it.</p><div class="actions">${STAGES.map((s,i)=>i>0&&STAGE_PREVIEW.includes(i+1)?`<button class="ghost" type="button" data-act="previewstage" data-s="${i+1}">${s.n}</button>`:'').join('')||'<span class="note">More stage artwork is on the way.</span>'}</div></div>`};
};

/* =================== events =================== */
function onAct(el){const a=el.dataset.act;
  if(a&&a[0]==='t'&&TALK_ACTS[a])return TALK_ACTS[a](el);
  if(a==='close')return closeAll();if(a==='back')return back();
  if(a==='room')return travel(el.dataset.p);
  if(a==='home')return travel('home');
  if(a==='door')return openView('door');
  if(a==='signout')return signOut();
  if(a==='export')return exportData();
  if(a==='bonfire')return openView('bonfire');
  if(a==='logpath')return openView('logpath',el.dataset.p);
  if(a==='rtab'){S.rtab[S.loc]=el.dataset.t;$('sheetBody').scrollTop=0;renderSheet();return;}
  if(a==='range'){S.range=el.dataset.r;renderSheet();return;}
  if(a==='contrib'){if(!(S.profile.goals||[]).length){S.rtab.wealth='goals';travel('wealth');setTimeout(()=>setOpen(true),2100);return;}return openView('contrib',el.dataset.g);}
  if(a==='delgoal'){saveProfile(p=>p.goals=(p.goals||[]).filter(g=>g.id!==el.dataset.g));return;}
  if(a==='acct')return openView('acct',el.dataset.a);
  if(a==='investlog')return openView('investlog');
  if(a==='delacct'){saveProfile(p=>{p.invest.accounts=p.invest.accounts.filter(x=>x.id!==el.dataset.a);snapTotal(p);});return;}
  if(a==='quick'&&el.dataset.h==='save'&&(S.profile.goals||[]).length){closeAll();return openView('contrib');}
  if(a==='quick'&&el.dataset.h==='invest'){if((S.profile.invest?.accounts||[]).length){closeAll();return openView('investlog');}closeAll();S.rtab.wealth='investing';if(S.loc!=='wealth'){travel('wealth');setTimeout(()=>setOpen(true),2100);}else{renderSheet();setOpen(true);}toast('Add an investment account first',null);return;}
  if(a==='quick'){const h=habit(el.dataset.h);if(!h)return;if(needsForm(h))return openView('entry',h.id);log(h);return;}
  if(a==='unlog'||a==='del'){const e=entries().find(x=>x.id===el.dataset.e);if(e)removeEntry(e);return;}
  if(a==='habits')return openView('habits',el.dataset.p);
  if(a==='addobj')return openView('addobj');
  if(a==='starter'){const w=weekOf(new Date());saveProfile(p=>{p.runs[w.id]={objs:STARTER.filter(o=>o.h==='cap'||p.habits.some(h=>h.id===o.h)).map(o=>({id:uid(),h:o.h,target:o.target,by:'count'}))};});toast('Starter run set for this week',null);return;}
  if(a==='delobj'){const w=weekOf(new Date());saveProfile(p=>{const r=p.runs[w.id];if(r)r.objs=r.objs.filter(o=>o.id!==el.dataset.o);});return;}
  if(a==='pickcat'){el.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===el)));return;}
  if(a==='reachout'){const h=habit('reach');if(h)log(h,{person:el.dataset.person});return;}
  if(a==='delperson'){saveProfile(p=>p.people=p.people.filter(x=>x.id!==el.dataset.person));return;}
  if(a==='delbook'){saveProfile(p=>p.books=p.books.filter(x=>x.id!==el.dataset.b));return;}
  if(a==='delhabit'){saveProfile(p=>p.habits=p.habits.filter(x=>x.id!==el.dataset.h));return;}
  if(a==='toggledaily'){saveProfile(p=>{const h=p.habits.find(x=>x.id===el.dataset.h);if(h)h.daily=!h.daily;});return;}
  if(a==='previewstage'){const n=+el.dataset.s;S.stack=[];drawModal();S.preview=n;window.HB_ENGINE?.setStage(n);setOpen(false);toast(`Previewing ${STAGES[n-1].n} for 10 seconds`,null);setTimeout(()=>{if(S.preview===n){S.preview=null;renderHead(stats());}},10000);return;}
  if(a==='rest'){saveProfile(p=>{p.rests=[...(p.rests||[]),el.dataset.d];});toast('You rested at the bonfire. Your streak holds.',null);window.HB_ENGINE?.reward();return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||!$('stage').contains(el))return;ev.preventDefault();onAct(el);});
document.addEventListener('submit',ev=>{const f=ev.target;
  if(f.id==='goalForm'){ev.preventDefault();const n=$('gName').value.trim(),t=parseFloat($('gTarget').value);if(!n||!(t>0)){$('gErr').textContent='Add a name and a target amount.';$('gErr').hidden=false;return;}
    const g={id:uid(),name:n,target:t,start:Math.max(0,parseFloat($('gStart').value)||0)};if($('gDate').value)g.date=$('gDate').value;document.activeElement&&document.activeElement.blur();saveProfile(p=>{p.goals=[...(p.goals||[]),g];});toast(`Goal added: ${n}`,null);return;}
  if(f.id==='acctForm'){ev.preventDefault();const n=$('aName').value.trim();if(!n){$('aErr').textContent='Give the account a name.';$('aErr').hidden=false;return;}
    const a={id:uid(),name:n,type:$('aType').value,value:Math.max(0,parseFloat($('aVal').value)||0),upd:today()};document.activeElement&&document.activeElement.blur();saveProfile(p=>{p.invest=p.invest||{accounts:[],snaps:[]};p.invest.accounts.push(a);snapTotal(p);});toast(`Added ${n}`,null);return;}
if(f.classList.contains('pgForm')){ev.preventDefault();const v=parseInt(f.querySelector('input').value);document.activeElement&&document.activeElement.blur();if(!(v>=0))return;updatePage(f.dataset.b,v);return;}
if(['capForm','personForm','bookForm'].includes(f.id)&&document.activeElement)document.activeElement.blur();
  if(f.id==='capForm'){ev.preventDefault();const v=Math.max(0,parseFloat($('capIn').value)||0);saveProfile(p=>p.cap=v);toast(`Weekly cap set to ${money(v)}`,null);}
  if(f.id==='personForm'){ev.preventDefault();const n=$('personIn').value.trim();if(!n)return;saveProfile(p=>p.people.push({id:uid(),name:n}));}
  if(f.id==='bookForm'){ev.preventDefault();const t=$('bookTitle').value.trim();if(!t)return;const pg=parseInt($('bookPages').value)||0;let st0=Math.max(0,parseInt($('bookStart').value)||0);if(pg)st0=Math.min(st0,pg);saveProfile(p=>p.books.push({id:uid(),title:t,pages:pg,start:st0}));toast(`Added ${t}${st0?`, on page ${st0}`:''}`,null);}
});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if(!$('talk').hidden){ev.preventDefault();talkBack();return;}if(S.stack.length){ev.preventDefault();back();}else if(S.open){setOpen(false);}else if(S.loc!=='home'){travel('home');}});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;renderSheet();$('sheetBody').scrollTop=0;}));
$('sheetToggle').addEventListener('click',()=>setOpen(!S.open));
$('logFab').addEventListener('click',()=>S.loc==='home'?openView('log'):openView('logpath',S.loc));
$('stageTag').addEventListener('click',()=>S.loc==='home'?openView('door'):travel('home'));

function renderAll(){if(!S.profile)return;if(!S.profile.habits.some(h=>h.id==='invest')&&!S.migrating){S.migrating=true;saveProfile(p=>{if(!p.habits.some(h=>h.id==='invest'))p.habits.push({id:'invest',p:'wealth',label:'Invest',xp:25,kind:'invest'});});S.migrating=false;return;}renderSheet();renderLocation();refreshModal();placeFab();}


/* =================== room keepers =================== */
const MC=window.MCE_CONTENT||{npc:{},lessons:{}};
const T={pid:null,typing:0,full:''};
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function findLesson(id){for(const k in MC.lessons){const l=MC.lessons[k].find(x=>x.id===id);if(l)return l;}return null;}
function lessonState(pid){const read=S.profile?.lessons||{};const list=MC.lessons[pid]||[];const t=today();
  return{list,read,doneToday:list.some(l=>read[l.id]===t),next:list.find(l=>!read[l.id]),past:list.filter(l=>read[l.id])};}
function faceStyle(pid){const n=MC.npc[pid];const S_=2.7;const [fx,fy]=n.face.map(v=>v/100);const p=v=>((v*S_-.5)/(S_-1)*100).toFixed(1)+'%';
  return`background-image:url(assets/npc-${pid}.webp);background-position:${p(fx)} ${p(fy)}`;}
function syncNpc(){const f=$('npcFab');const pid=S.loc;const n=pid&&pid!=='home'&&MC.npc[pid];
  if(!n||S.shown===false||!S.profile){f.classList.add('off');return;}
  f.querySelector('.face').setAttribute('style',faceStyle(pid));f.querySelector('.nm').textContent=n.name.replace(/^The /,'');
  const ls=lessonState(pid);f.querySelector('.dot').hidden=!(ls.next&&!ls.doneToday);
  f.setAttribute('aria-label',`Speak with ${n.name}${ls.next&&!ls.doneToday?', new lesson waiting':''}`);f.classList.remove('off');}
function daysAgo(d){return Math.round((parseD(today())-parseD(d))/864e5);}
function npcInsight(pid){const st=stats();const n=MC.npc[pid];const mine=st.all.filter(e=>e.p===pid);const last=mine[0];
  const lv=lvl(st.byPath[pid].xp).lv;const wk=st.byPath[pid].week;const sk=pathStreak(mine);const t=today();
  const gap=last?daysAgo(last.d):null;
  let a='';
  if(pid==='wealth'){const pr=objProgress({h:'cap'},st.w.id);const goals=S.profile.goals||[];
    a=pr.cap?(pr.spent<=pr.cap?`You have spent ${money(pr.spent)} of your ${money(pr.cap)} this week. The scales still favour you.`:`You are ${money(pr.spent-pr.cap)} past your ${money(pr.cap)} cap this week. It happens. Tighten the purse for the days left.`):'';
    if(goals.length){const g=goals[0];const f=g.target?Math.min(1,goalSaved(g,st.all)/g.target):0;a+=` Your ${esc(g.name)} fund stands at ${Math.round(f*100)}%.`;}}
  else if(pid==='discipline'){const hs=S.profile.habits.filter(h=>h.p==='discipline'&&h.daily);const done=hs.filter(h=>st.all.some(e=>e.h===h.id&&e.d===t));
    a=hs.length?(done.length===hs.length?'Every rite kept today. The stone notices.':`${done.length} of ${hs.length} daily rites kept today. ${hs.filter(h=>!done.includes(h)).map(h=>h.label).slice(0,2).join(', ')} still wait.`):'';}
  else if(pid==='vitality'){a=wk?`You moved ${wk} time${wk>1?'s':''} this week.`:'You have not moved with me this week yet. A walk would do.';
    const mins=st.all.filter(e=>e.p==='vitality'&&e.d>=dstr(st.w.mon)&&habit(e.h)?.unit==='min').reduce((s,e)=>s+(+e.q||0),0);if(mins)a+=` ${mins} logged minutes. The aim is 150 a week.`;}
  else if(pid==='bonds'){const ppl=S.profile.people||[];
    if(ppl.length){const ages=ppl.map(p=>{const e=st.all.find(e=>e.person===p.id);return{p,g:e?daysAgo(e.d):999};}).sort((x,y)=>y.g-x.g);const o=ages[0];
      a=o.g>=14?`${esc(o.p.name)}'s lantern is burning low${o.g<999?`. It has been ${o.g} days`:', it has never been lit'}. Maybe today?`:'Every lantern on the bridges is lit. That is rare. Well done.';}
    else a='No lanterns hang here yet. Add the people who matter in the Lanterns tab.';}
  else if(pid==='craft'){a=wk?`${wk} session${wk>1?'s':''} at the bench this week.`:'The bench has been quiet this week. Ten minutes is enough to wake it.';}
  else if(pid==='lore'){const bs=(S.profile.books||[]);const st2=stats();const cur=bs.find(b=>!b.pages||bookRead(b,st2.all)<b.pages);const ls=lessonState('lore');
    a=cur?`You are on page ${bookRead(cur,st2.all)} of ${esc(cur.title)}. Pip approves.`:'No book on your shelf yet. Add one in the Bookshelf tab.';if(ls.past.length)a+=` You have read ${ls.past.length} of my pages.`;}
  const g=gap===null?'We have not met properly yet. Log something here and I will remember.':gap===0?(sk>1?`You are ${sk} days running on this path.`:'You were here today already.'):gap===1?'You were here yesterday.':`It has been ${gap} days since you last came this way.`;
  return `${g} ${a} This path is at level ${lv}.`.replace(/\s+/g,' ').trim();}
function talkSay(text,choices){clearInterval(T.typing);const b=$('talkBody');T.full=text;$('talk').classList.remove('reading');
  if(reduceMotion){b.textContent=text;}else{let i=0;b.textContent='';T.typing=setInterval(()=>{i+=2;b.textContent=text.slice(0,i);if(i>=text.length)clearInterval(T.typing);},22);}
  $('talkChoices').innerHTML=choices.map(([act,label,k,cls,data])=>`<button type="button" data-act="${act}" ${data||''} class="${cls||''}">${label}${k?`<span class="k">${k}</span>`:''}</button>`).join('');}
function mainChoices(pid){const ls=lessonState(pid);const n=MC.npc[pid];const c=[];
  if(ls.next&&!ls.doneToday)c.push(['tlesson',`<span class="new">●</span> Today’s lesson: ${esc(ls.next.t)}`,`${ls.next.min} min`]);
  else c.push(['tlesson','Today’s lesson',ls.next?'tomorrow':'all read']);
  c.push(['thow','How am I doing?']);
  if(ls.past.length)c.push(['tpast','Lessons you’ve read',`${ls.past.length}`]);
  c.push(['tbye','Farewell']);return c;}
function openTalk(pid){const n=MC.npc[pid];if(!n)return;T.pid=pid;closeAll();setOpen(false);
  const tk=$('talk');tk.querySelector('.tPortrait').src=`assets/npc-${pid}.webp`;$('talkName').textContent=n.name;$('talkTitle').textContent=n.title;
  tk.hidden=false;talkSay(pickOne(n.hello),mainChoices(pid));setTimeout(()=>$('talkChoices').querySelector('button')?.focus({preventScroll:true}),60);}
function closeTalk(){const tk=$('talk');if(tk.hidden)return;clearInterval(T.typing);tk.hidden=true;T.pid=null;syncNpc();$('npcFab').focus?.({preventScroll:true});}
function talkBack(){if($('talk').classList.contains('reading'))talkSay(MC.npc[T.pid].offer,mainChoices(T.pid));else closeTalk();}
function showLesson(l,isNew){const pid=T.pid;$('talk').classList.add('reading');clearInterval(T.typing);
  $('talkBody').innerHTML=`<article class="lesson"><h3>${esc(l.t)}</h3><p class="meta">${PMAP[pid].name} · ${l.min} minute read</p>${l.body.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="ask"><small>Try this</small>${esc(l.ask)}</div></article>`;
  $('talkBody').scrollTop=0;
  $('talkChoices').innerHTML=isNew?`<button type="button" class="pri" data-act="tdone" data-l="${l.id}">Done · +15 XP</button>`:`<button type="button" data-act="tback">Back</button>`;}
const TALK_ACTS={
  tlesson(){const pid=T.pid;const ls=lessonState(pid);const n=MC.npc[pid];
    if(!ls.next)return talkSay(n.empty,mainChoices(pid));
    if(ls.doneToday)return talkSay(n.done,mainChoices(pid));
    showLesson(ls.next,true);},
  thow(){talkSay(npcInsight(T.pid),mainChoices(T.pid));},
  tpast(){const ls=lessonState(T.pid);talkSay('Which one shall we look at again?',[...ls.past.map(l=>['tread',esc(l.t),fmtDay(ls.read[l.id]),'',`data-l="${l.id}"`]),['tback','Back']]);},
  tread(el){const l=findLesson(el.dataset.l);if(l)showLesson(l,false);},
  tback(){talkSay(MC.npc[T.pid].offer,mainChoices(T.pid));},
  tdone(el){const pid=T.pid;const id=el.dataset.l;if(S.profile.lessons?.[id])return;
    saveProfile(p=>{p.lessons={...(p.lessons||{}),[id]:today()};});
    log({id:'lesson',p:pid,xp:15},{lesson:id});
    talkSay(`${pickOne(['Well read.','Good.','There. That will stay with you.'])} ${MC.npc[pid].done}`,mainChoices(pid));syncNpc();},
  tbye(){if(!T.pid)return;const n=MC.npc[T.pid];if($('talk').classList.contains('reading')){talkBack();return;}
    talkSay(pickOne(n.bye),[]);setTimeout(closeTalk,reduceMotion?400:1100);}
};
$('npcFab').addEventListener('click',()=>openTalk(S.loc));
$('talkBody').addEventListener('click',()=>{if($('talk').classList.contains('reading'))return;clearInterval(T.typing);$('talkBody').textContent=T.full;});

/* =================== hooks for the world =================== */
window.HB={
  show(v){S.shown=v;$('sheet').classList.toggle('off',!v);$('logFab').classList.toggle('off',!v);syncNpc();if(!v){setOpen(false);closeAll();}placeFab();},
  open(name,arg){if(name==='room')return travel(arg);openView(name,arg);},
  expand(){setOpen(true);}
};
window.addEventListener('resize',placeFab);
document.addEventListener('change',ev=>{if(ev.target.id==='importFile'&&ev.target.files[0])importData(ev.target.files[0]);});
$('signin').addEventListener('click',signIn);
initStore();
})();
</script>
